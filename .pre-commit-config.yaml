default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^ui/tsconfig.*\.json$
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, master]

  - repo: local
    hooks:
      - id: no-dashes
        name: no em/en dashes
        entry: "\u2013|\u2014"
        language: pygrep
        types: [text]
        exclude: ^(uv\.lock|ui/bun\.lock|tests/fixtures/.*)$
      - id: ruff-format
        name: ruff format
        entry: uv run -- ruff format
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run -- ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run -- bandit -c pyproject.toml -q -r app.py dictum gunicorn.conf.py
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
